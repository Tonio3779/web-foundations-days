<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 4 - Note Pad & Character Counter</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Quick Note</h1>
      <button id="theme-toggle">Dark mode</button>
    </header>

    <main>
      <label for="note-text">Enter your note:</label>
      <textarea id="note-text" placeholder="Start typing..."></textarea>

      <div class="counter-info">
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
      </div>

      <div class="actions">
        <button id="clear-btn">Clear</button>
      </div>
    </main>
  </div>
</body>
</html>
